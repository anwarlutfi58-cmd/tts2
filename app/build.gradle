plugins {
    id 'com.android.application'
}

android {
    namespace 'com.pla.tts'
    compileSdk 34

    defaultConfig {
        applicationId "com.pla.tts"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// INI TAMBAHANNYA (Biar nggak error ikon)
androidComponents {
    onVariants(selector().all()) { variant ->
        variant.resValues.put(variant.makeResValue(androidx.core.internal.ResValue("drawable", "ic_launcher", "@android:drawable/sym_def_app_icon")).id)
        variant.resValues.put(variant.makeResValue(androidx.core.internal.ResValue("drawable", "ic_launcher_round", "@android:drawable/sym_def_app_icon")).id)
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
}